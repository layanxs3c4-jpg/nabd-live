name: Build NABD Live for Windows

on:
  push:
    branches:
      - main
    paths:
      - NABD-Live-github-overlay.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VITE_DISTRIBUTION: nabd
      RELEASE_TAG: v0.11.3-nabd.4

    steps:
      - name: Check out the NABD builder
        uses: actions/checkout@v6
        with:
          path: nabd

      - name: Check out the tested AIRI base
        uses: actions/checkout@v6
        with:
          repository: moeru-ai/airi
          ref: addfec198118028da55142344e5d20777b2ced5a
          path: airi

      - name: Add NABD Live to AIRI
        shell: pwsh
        run: Expand-Archive nabd/NABD-Live-github-overlay.zip -DestinationPath airi -Force

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: airi/pnpm-lock.yaml

      - name: Install packages
        working-directory: airi
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        working-directory: airi
        run: pnpm run build:packages

      - name: Build the TikFinity engine
        working-directory: airi
        run: pnpm -F @proj-airi/airi-plugin-tikfinity build

      - name: Run NABD regression tests
        working-directory: airi
        run: pnpm exec vitest run plugins/airi-plugin-tikfinity/test apps/stage-tamagotchi/src/renderer/pages/settings/tikfinity/use-nabd-quick-setup.test.ts packages/stage-ui/src/stores/settings/avatar.test.ts

      - name: Type-check the Windows app
        working-directory: airi
        run: pnpm -F @proj-airi/stage-tamagotchi typecheck

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: true
          include-templates: true

      - name: Export the Windows avatar stage
        working-directory: airi/engines/stage-tamagotchi-godot
        shell: bash
        run: |
          mkdir -p out/win
          godot --headless --export-release "Windows Desktop" out/win/godot-stage.exe

      - name: Build the NABD Live installer
        working-directory: airi
        run: pnpm run -F @proj-airi/stage-tamagotchi build && pnpm -F @proj-airi/stage-tamagotchi exec electron-builder build --windows --x64 --publish=never

      - name: Create the installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem airi/apps/stage-tamagotchi/dist/NABD-Live-*-windows-x64-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'NABD Live installer not found.' }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content airi/apps/stage-tamagotchi/dist/SHA256SUMS.txt

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: NABD-Live-Windows-x64
          path: |
            airi/apps/stage-tamagotchi/dist/NABD-Live-*-windows-x64-setup.exe
            airi/apps/stage-tamagotchi/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the permanent Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem airi/apps/stage-tamagotchi/dist/NABD-Live-*-windows-x64-setup.exe | Select-Object -First 1
          $checksum = Get-Item airi/apps/stage-tamagotchi/dist/SHA256SUMS.txt
          if (-not $installer) { throw 'NABD Live installer not found.' }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $installer.FullName $checksum.FullName --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:RELEASE_TAG $installer.FullName $checksum.FullName --repo $env:GITHUB_REPOSITORY --title "NABD Live 0.11.3-nabd.4 for Windows" --notes "Windows x64 installer with TikFinity and direct TikTok LIVE sources, existing in-app chat and speech providers, fastest-answer quizzes, polls, viewer points, and adjustable avatar motion."
          }
